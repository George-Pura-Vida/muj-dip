name: Verify MŮJ-DIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-mujdip
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check dist/app.js && node --check dist/comparison.js
      - run: php -l dist/auth/mail.php && php -l dist/auth/bootstrap.php && php -l dist/admin.php && php -l dist/account.php && php -l dist/index.php && php -l dist/legal.php
      - run: php mail-templates.test.php
      - run: node auth.test.mjs
      - run: node --test approval-migration.test.mjs

